<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代 BMI 計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-group:focus-within label {
            color: #3b82f6;
        }
        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 transition-all">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">BMI 計算機</h1>
            <p class="text-gray-500 text-sm">輸入身高與體重，快速評估您的身體質量狀況</p>
        </div>

        <div class="space-y-6">
            <!-- 身高輸入 -->
            <div class="input-group">
                <label for="height" class="block text-sm font-semibold text-gray-700 mb-2">身高 (公分)</label>
                <input type="number" id="height" placeholder="例如: 175" 
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <!-- 體重輸入 -->
            <div class="input-group">
                <label for="weight" class="block text-sm font-semibold text-gray-700 mb-2">體重 (公斤)</label>
                <input type="number" id="weight" placeholder="例如: 70" 
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <!-- 計算按鈕 -->
            <button onclick="calculateBMI()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform active:scale-95 transition-all">
                開始計算
            </button>

            <!-- 結果顯示區域 -->
            <div id="resultArea" class="hidden mt-8 p-6 rounded-2xl text-center border-2 border-dashed border-gray-200 animate-in fade-in duration-500">
                <div class="text-gray-600 text-sm mb-1">您的 BMI 指數</div>
                <div id="bmiValue" class="text-5xl font-extrabold text-blue-600 mb-3">0.0</div>
                <div id="bmiStatus" class="inline-block px-4 py-1 rounded-full text-sm font-bold bg-gray-100 text-gray-700">
                    狀態讀取中...
                </div>
                <p id="bmiAdvice" class="mt-4 text-gray-500 text-sm italic"></p>
            </div>
        </div>

        <!-- 參考標準說明 -->
        <div class="mt-8 pt-6 border-t border-gray-100">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 text-center">BMI 參考標準</h3>
            <div class="grid grid-cols-2 gap-2 text-[10px] text-gray-500">
                <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-blue-400 mr-2"></span>過輕: < 18.5</div>
                <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>正常: 18.5 - 24</div>
                <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>過重: 24 - 27</div>
                <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span>肥胖: > 27</div>
            </div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const resultArea = document.getElementById('resultArea');
            const bmiValueDisplay = document.getElementById('bmiValue');
            const bmiStatusDisplay = document.getElementById('bmiStatus');
            const bmiAdviceDisplay = document.getElementById('bmiAdvice');

            // 基礎驗證
            if (!height || !weight || height <= 0 || weight <= 0) {
                showSimpleError("請輸入有效的身高與體重數值！");
                return;
            }

            // BMI 公式: 體重(kg) / 身高^2(m)
            const heightInMeters = height / 100;
            const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(1);

            // 顯示結果區域
            resultArea.classList.remove('hidden');
            bmiValueDisplay.innerText = bmi;

            // 判斷狀態與樣式
            let status = "";
            let colorClass = "";
            let advice = "";

            if (bmi < 18.5) {
                status = "體重過輕";
                colorClass = "bg-blue-100 text-blue-700";
                advice = "體重過輕可能與營養攝取不足有關，建議適量補充熱量並諮詢營養師。";
            } else if (bmi >= 18.5 && bmi < 24) {
                status = "健康體重";
                colorClass = "bg-green-100 text-green-700";
                advice = "太棒了！您的體重在理想範圍內，請繼續保持健康的飲食與運動。";
            } else if (bmi >= 24 && bmi < 27) {
                status = "體重過重";
                colorClass = "bg-yellow-100 text-yellow-700";
                advice = "提醒您需要注意飲食管理與運動習慣，避免發展為肥胖。";
            } else {
                status = "肥胖";
                colorClass = "bg-red-100 text-red-700";
                advice = "您的體位屬於肥胖，建議逐步調整生活型態並諮詢醫療專業建議。";
            }

            // 更新 UI
            bmiStatusDisplay.className = `inline-block px-4 py-1 rounded-full text-sm font-bold ${colorClass}`;
            bmiStatusDisplay.innerText = status;
            bmiAdviceDisplay.innerText = advice;
            bmiValueDisplay.className = `text-5xl font-extrabold mb-3 ${colorClass.split(' ')[1].replace('700', '600')}`;

            // 平滑滾動至結果
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showSimpleError(msg) {
            const resultArea = document.getElementById('resultArea');
            resultArea.classList.remove('hidden');
            document.getElementById('bmiValue').innerText = "!";
            document.getElementById('bmiStatus').innerText = "輸入錯誤";
            document.getElementById('bmiStatus').className = "inline-block px-4 py-1 rounded-full text-sm font-bold bg-gray-100 text-gray-500";
            document.getElementById('bmiAdvice').innerText = msg;
        }
    </script>
</body>
</html>
